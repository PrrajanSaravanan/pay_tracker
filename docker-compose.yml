services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: paytracker
      POSTGRES_PASSWORD: paytracker
      POSTGRES_DB: paytracker
    ports:
      # 5433 on the host: a native Windows Postgres may already own 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paytracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
